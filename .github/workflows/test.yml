name: Java Plain CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev", "feat/*"]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download JUnit 5 Console Launcher
        run: |
          curl -sL https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.0/junit-platform-console-standalone-1.10.0.jar -o junit-platform-console-standalone.jar

      - name: Compile Java Code
        run: |
          mkdir -p bin
          javac -d bin -cp junit-platform-console-standalone.jar $(find src test -name "*.java")

      - name: Run JUnit 5 Unit Tests
        run: |
          java -jar junit-platform-console-standalone.jar --class-path bin --scan-classpath

      - name: Package to Executable JAR
        run: |
          jar cvf app.jar -C bin .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-rental-app
          path: app.jar